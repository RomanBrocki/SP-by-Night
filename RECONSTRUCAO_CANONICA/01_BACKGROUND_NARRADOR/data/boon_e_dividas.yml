  - personagem: "Artur Macedo"
    fonte: "8.4 - As fichas essenciais"
    texto: "Medo: perder o controle narrativo da cidade e ver a Corte regredir para feudos pessoais, boons opacos e reação lenta. O pesadelo de Artur não é uma derrota frontal; é a máquina que ele montou começar a falhar por dentro."
  - personagem: "Artur Macedo"
    fonte: "8.4 - As fichas essenciais"
    texto: "Segredo: tolerou pactos e exceções que negaria em público, inclusive alianças de periferia que preservaram a cidade. Isso encosta diretamente em Luiza Salles e Samira al-Haddad. Se vier à tona, vira cobrança de boon, sanção de Corte e disputa de autoridade."
  - personagem: "Artur Macedo"
    fonte: "8.4 - As fichas essenciais"
    texto: "A postura endurece quando o assunto toca \"perder o controle narrativo da cidade e ver a Corte regredir para feudos pessoais, boons opacos e reação lenta. O pesadelo de Artur não é uma derrota frontal; é a máquina que ele montou começar a falhar por dentro\" ou \"tolerou pactos e exceções que negaria em público, inclusive alianças de periferia que preservaram a cidade\"."
