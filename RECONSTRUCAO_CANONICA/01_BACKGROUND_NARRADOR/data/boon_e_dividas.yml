  - personagem: "Luiza Salles"
    fonte: "8.4 - As fichas essenciais"
    texto: "Situação de Corte: Luiza é Senescal e sustenta a engrenagem social da Camarilla, mas não ocupa cadeira de Harpia. Aiko Tanaka e Daniel Sato seguram o trabalho visível de boons, anúncios e mediação. As duas vagas abertas vieram da queda de 2025: Mirella Baptista, morta após uma operação do Lumen, e Ícaro Moretti, derrubado por exposição grotesca, quebra de Máscara e crimes contra a própria Corte. Desde então, Luiza tenta manter a casa funcional enquanto a cidade disputa quem vai herdar essas cadeiras - e se isso exige um segundo Elysium recorrente."
  - personagem: "Luiza Salles"
    fonte: "8.4 - As fichas essenciais"
    texto: "A postura endurece quando o assunto toca \"que uma falha pública de Elysium prove que seu controle é cenografia e abra espaço para rival interno\" ou \"mantém registros informais de humilhações, favores e erros de etiqueta que valem mais que qualquer ata oficial\"."
