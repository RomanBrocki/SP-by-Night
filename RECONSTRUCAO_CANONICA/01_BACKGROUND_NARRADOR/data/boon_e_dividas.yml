  - personagem: "Aiko Tanaka"
    fonte: "8.4 - As fichas essenciais"
    texto: "Pede aos PJs para impedir um encontro em Pinheiros sem violência e sem cena. Entrada: lista vazada e convidado errado; custo provável: boon, discrição ou favor futuro."
  - personagem: "Aiko Tanaka"
    fonte: "8.4 - As fichas essenciais"
    texto: "Entrega um nome que precisa desaparecer da noite por uma semana. Entrada: boato sobre foto comprometora; custo provável: dívida social e resultado sem rastro."
  - personagem: "Ana \"Carbono\""
    fonte: "8.4 - As fichas essenciais"
    texto: "Segredo: Ela já vendeu uma fórmula para o Ministry sem entender o impacto. Isso encosta diretamente em Daniel Sato (aliança; anonimato em troca de favores) e Talita \"Serpente\" (fornecedora; \"milagres\" por boons). Se vier à tona, vira acerto de contas e perda de território ou rede."
  - personagem: "Ana \"Carbono\""
    fonte: "8.4 - As fichas essenciais"
    texto: "Verdade perigosa: Ela tem uma lista de compradores Camarilla e Anarquistas. Hoje, quem está mais perto de descobrir isso é Daniel Sato (aliança; anonimato em troca de favores)."
  - personagem: "Ana \"Carbono\""
    fonte: "8.4 - As fichas essenciais"
    texto: "Pinheiros e circuitos do mercado cinza. Pode dar aos PJs um sangue que engana câmera por horas. Entrada: Pinheiros e rede de entrega; custo provável: boon, cobertura ou silêncio."
  - personagem: "Ana \"Carbono\""
    fonte: "8.4 - As fichas essenciais"
    texto: "Pinheiros e circuitos do mercado cinza. É caçada por um operador da Operação Lumen. Entrada: Pinheiros e rede de entrega; custo provável: boon, cobertura ou silêncio."
  - personagem: "Ana \"Carbono\""
    fonte: "8.4 - As fichas essenciais"
