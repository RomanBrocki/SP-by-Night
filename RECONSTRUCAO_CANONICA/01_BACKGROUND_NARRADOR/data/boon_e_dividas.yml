  - personagem: "Camila \"Noite-Funda\""
    fonte: "8.4 - As fichas essenciais"
    texto: "Verdade perigosa: Ela já ajudou a sabotar um registro de boons do Príncipe. Hoje, quem está mais perto de descobrir isso é Padre Miguel Aranha (relação de cria; ódio e dependência)."
